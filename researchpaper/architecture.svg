<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300">
  <style>text{font-family: Arial; font-size:12px}</style>
  <rect x="20" y="40" width="160" height="80" fill="#e8f4ff" stroke="#1f77b4"/>
  <text x="100" y="65" text-anchor="middle">Django</text>
  <text x="100" y="82" text-anchor="middle">Middleware</text>

  <rect x="260" y="20" width="160" height="120" fill="#f8efe6" stroke="#ff7f0e"/>
  <text x="340" y="45" text-anchor="middle">Cache Manager</text>
  <text x="340" y="62" text-anchor="middle">(heap + CMS + bloom)</text>

  <rect x="500" y="40" width="160" height="80" fill="#f0fff0" stroke="#2ca02c"/>
  <text x="580" y="65" text-anchor="middle">Redis</text>

  <line x1="180" y1="80" x2="260" y2="80" stroke="#000" marker-end="url(#arrow)"/>
  <line x1="420" y1="80" x2="500" y2="80" stroke="#000" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#000" />
    </marker>
  </defs>
</svg>